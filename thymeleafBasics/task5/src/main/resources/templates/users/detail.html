<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commonHead :: commonHead('ユーザー詳細')}">
</head>
<body>
    <!-- ヘッダーフラグメント -->
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main>
            <div th:replace="~{fragments/errorMessage :: alert(info, メッセージエリア)}"></div>
            <h1>ユーザー詳細</h1>
            <p th:unless="${user != null}">
                ユーザーが登録されていません。
            </p>
            
            <!-- ユーザーがいる場合のみテーブルを表示 -->
            <table th:if="${user != null}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>名前</th>
                        <th>メールアドレス</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- th:each でリストをループ -->
                    <tr>
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.name}">サンプル名</td>
                        <td th:text="${user.email}">sample@example.com</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

</body>
</html>
