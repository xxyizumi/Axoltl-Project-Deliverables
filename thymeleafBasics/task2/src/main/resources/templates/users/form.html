<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"] {
            width: 300px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input.error { border-color: #dc3545; }
        .error-message { color: #dc3545; font-size: 0.9em; margin-top: 5px; }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>ユーザー登録</h1>
    
    <!-- th:object でフォームにオブジェクトをバインド -->
    <form th:action="@{/users}" th:object="${userForm}" method="post">
        
        <div class="form-group">
            <label for="name">名前</label>
            <!-- th:field で入力フィールドとプロパティを連携 -->
            <input type="text" id="name" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'error' : ''">
            <!-- th:errors でエラーメッセージを表示 -->
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message">
                エラーメッセージ
            </p>
        </div>
        
        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'error' : ''">
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message">
                エラーメッセージ
            </p>
        </div>

        <div class="form-group">
            <label for="email">部署</label>
            <select th:field="*{department}">
                <option value="">選択してください</option>
                <option value="sales">営業部</option>
                <option value="engineering">技術部</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'error' : ''">
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message">
                エラーメッセージ
            </p>
        </div>

        <div class="form-group">
            <label for="passwordConfirm">確認用パスワード</label>
            <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
                   th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'error' : ''">
            <p th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" class="error-message">
                エラーメッセージ
            </p>
            <p th:if="${#fields.hasErrors('passwordValid')}" th:errors="*{passwordValid}" class="error-message">
                エラーメッセージ
            </p>
        </div>
        <div class="form-group">
            <label for="agreedToTerms">利用規約</label>
            <input type="checkbox" th:field="*{agreedToTerms}"
                   th:classappend="${#fields.hasErrors('agreedValid')} ? 'error' : ''">
            <p th:if="${#fields.hasErrors('agreedValid')}" th:errors="*{agreedValid}" class="error-message">
                エラーメッセージ
            </p>
        </div>


        <button type="submit">登録</button>
    </form>
    
    <hr>
    <a th:href="@{/users}">ユーザー一覧に戻る</a>
</body>
</html>
