spring:
  application:
    name: thymeleaf-advanced
  
  # データベース設定（H2インメモリ）
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  # メッセージ設定（STEP 4で使用）
  messages:
    basename: messages
    encoding: UTF-8
  
  # Thymeleaf設定
  thymeleaf:
    cache: false  # 開発時はキャッシュ無効化

# ログ設定
logging:
  level:
    org.springframework.security: DEBUG
