<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-base}">
<head>
    <title>お問い合わせ</title>
</head>
<body>
    <section layout:fragment="sidebar">
        <aside class="sidebar">
            <ul>
                <li><a th:href="@{/}">🏠 ホーム</a></li>
                <li><a th:href="@{/about}">👥 About</a></li>
                <li><a th:href="@{/contact}">➕ お問い合わせ</a></li>
            </ul>
        </aside>
    </section>
    <section layout:fragment="content">
        <h1 class="page-title">お問い合わせ</h1>
        <p class="page-description">ご質問やご意見をお寄せください</p>
        
        <div class="card">
            <form>
                <div style="margin-bottom: 1rem;">
                    <label for="name">お名前</label>
                    <input type="text" id="name" name="name" 
                           style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label for="email">メールアドレス</label>
                    <input type="email" id="email" name="email" 
                           style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label for="message">メッセージ</label>
                    <textarea id="message" name="message" rows="5" 
                              style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;"></textarea>
                </div>
                <button type="submit" 
                        style="background: #3498db; color: #fff; padding: 0.75rem 1.5rem; border: none; cursor: pointer;">
                    送信
                </button>
            </form>
        </div>
    </section>
</body>
</html>
