<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>商品一覧</title>
</head>
<body>
    <section layout:fragment="content">
        <h1 class="page-title">商品一覧</h1>
        <p class="page-description">data-*属性によるJavaScript連携デモ</p>
        
        <div class="product-grid">
            <div th:each="product : ${products}" 
                 class="card product-card"
                 th:data-product-id="${product.id}"
                 th:data-product-name="${product.name}"
                 th:data-product-price="${product.price}"
                 th:data-product-stock="${product.stock}">
                <h3 th:text="${product.name}">商品名</h3>
                <p class="price" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + ' 円'">価格</p>
                <p class="stock" th:text="'在庫: ' + ${product.stock} + ' 個'">在庫</p>
                <button class="btn btn-primary add-to-cart">カートに追加</button>
            </div>
        </div>
        
        <div id="cart-info" class="card" style="margin-top: 2rem;">
            <h2>カート情報</h2>
            <p id="cart-message">商品を選択してください</p>
        </div>
    </section>

    <script layout:fragment="scripts">
        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', function() {
                // 親要素（商品カード）からdata属性を取得
                const card = this.closest('.product-card');
                const productId = card.dataset.productId;
                const productName = card.dataset.productName;
                const productPrice = card.dataset.productPrice;
                
                localStorage.setItem("productId", productId);
                localStorage.setItem("productName", productName);
                localStorage.setItem("productPrice", productPrice);

                // カート情報を表示
                document.getElementById('cart-message').textContent = 
                    `${productName}（ID: ${productId}）を追加しました！価格: ${Number(productPrice).toLocaleString()}円`;
            });
        });
        addEventListener("DOMContentLoaded", (event) => {
            const productId = localStorage.getItem("productId");
            if (productId === undefined) {
                document.getElementById('cart-message').textContent = "商品を選択してください";
            } else {
                const productName = localStorage.getItem("productName");
                const productPrice = localStorage.getItem("productPrice");
                // カート情報を表示
                document.getElementById('cart-message').textContent = 
                    `${productName}（ID: ${productId}）を追加しました！価格: ${Number(productPrice).toLocaleString()}円`;
            }
        });
    </script>
</body>
</html>
