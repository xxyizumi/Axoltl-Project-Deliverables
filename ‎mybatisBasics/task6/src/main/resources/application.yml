spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

# MyBatis設定
mybatis:
  # Mapper XMLの場所
  mapper-locations: classpath:mapper/*.xml
  # 型エイリアス用パッケージ
  type-aliases-package: com.example.mybatisbasics.entity
  configuration:
    # スネークケース → キャメルケース自動変換
    map-underscore-to-camel-case: true
    # SQL実行ログ
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ログ設定
logging:
  level:
    com.example.mybatisbasics.mapper: DEBUG
